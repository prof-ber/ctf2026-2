<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <!-- Content Security Policy to prevent XSS -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none';"
        />
        <title>🪗🎇Chat Junino!🥜🌽</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }
            .container {
                max-width: 800px;
                margin: 0 auto;
            }
            .chat-box {
                border: 1px solid #ccc;
                height: 300px;
                overflow-y: scroll;
                padding: 10px;
                margin-bottom: 10px;
            }
            .message {
                margin-bottom: 5px;
                padding: 5px;
                background: #f0f0f0;
            }
            .message .user {
                font-weight: bold;
                color: #333;
            }
            input[type="text"],
            input[type="password"] {
                width: 200px;
                padding: 5px;
                margin: 5px;
            }
            button {
                padding: 5px 10px;
                margin: 5px;
            }
            .section {
                margin-bottom: 20px;
                padding: 10px;
                border: 1px solid #ddd;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🪗🎇Chat Junino!🥜🌽</h1>

            <div class="section">
                <h2>Login</h2>
                <input type="text" id="username" placeholder="Usuário" />
                <input type="password" id="password" placeholder="Senha" />
                <button onclick="login()">Login</button>
                <div id="login-result"></div>
            </div>

            <div class="section">
                <h2>Buscar Mensagens</h2>
                <input
                    type="text"
                    id="search"
                    placeholder="Buscar nas mensagens..."
                />
                <button onclick="searchMessages()">Buscar</button>
                <div id="search-results"></div>
            </div>

            <div class="section">
                <h2>Chat em Tempo Real</h2>
                <div id="chat-messages" class="chat-box"></div>
                <input
                    type="text"
                    id="message-input"
                    placeholder="Digite sua mensagem..."
                />
                <button onclick="sendMessage()">Enviar</button>
            </div>

            <div class="section">
                <h2>Área Administrativa</h2>
                <input
                    type="password"
                    id="secret"
                    placeholder="Senha administrativa"
                />
                <button onclick="getFlag()">Obter Flag</button>
                <div id="flag-result"></div>
            </div>
        </div>

        <script src="/socket.io/socket.io.js"></script>
        <script>
            function escapeHtml(text) {
                const map = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;",
                };
                return String(text).replace(/[&<>"']/g, (char) => map[char]);
            }

            function validateInput(input, maxLength = 500) {
                if (!input || typeof input !== "string") {
                    return "";
                }
                let cleaned = input.trim();
                cleaned = cleaned.substring(0, maxLength);
                cleaned = cleaned.replace(
                    /[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,
                    "",
                );
                return cleaned;
            }

            function sanitizeData(data) {
                if (typeof data === "string") {
                    const validated = validateInput(data);
                    return escapeHtml(validated);
                }
                return "";
            }

            function sanitizeAttribute(attr) {
                if (typeof attr !== "string") return "";
                return attr
                    .replace(/[<>"']/g, "")
                    .replace(/on\w+\s*=/gi, "")
                    .trim()
                    .substring(0, 100);
            }

            function isValidUrl(url) {
                if (!url || typeof url !== "string") return false;
                try {
                    const parsed = new URL(url, window.location.href);
                    // Apenas protoclos seguros
                    return ["http:", "https:", "ws:", "wss:"].includes(
                        parsed.protocol,
                    );
                } catch {
                    return false;
                }
            }

            // Rate limiting simples
            class RateLimiter {
                constructor(maxRequests = 10, windowMs = 60000) {
                    this.maxRequests = maxRequests;
                    this.windowMs = windowMs;
                    this.requests = [];
                }

                isAllowed() {
                    const now = Date.now();
                    // Remove requests antigas
                    this.requests = this.requests.filter(
                        (time) => now - time < this.windowMs,
                    );

                    if (this.requests.length >= this.maxRequests) {
                        console.warn("⚠️ Rate limit excedido!");
                        return false;
                    }

                    this.requests.push(now);
                    return true;
                }
            }

            const loginLimiter = new RateLimiter(5, 60000); // 5 tentativas/minuto
            const searchLimiter = new RateLimiter(5, 60000); // 10 buscas/minuto
            const messageLimiter = new RateLimiter(5, 60000); // 20 mensagens/minuto
            const flagLimiter = new RateLimiter(3, 60000); // 3 tentativas/minuto

            // ===== WSS =====
            const socket = io({
                upgrade: true,
                transports: ["websocket", "polling"],
                secure: true,
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                reconnectionAttempts: 5,
            });

            socket.on("connect", () => {
                console.log("✅ Conectado ao servidor (Socket.io)");
            });

            socket.on("connect_error", (error) => {
                console.error("❌ Erro de conexão:", error);
            });

            socket.on("chat message", (data) => {
                try {
                    const chatBox = document.getElementById("chat-messages");
                    if (!chatBox) return;

                    const username = sanitizeData(data.username || "Usuário");
                    const message = sanitizeData(data.message || "");
                    const timestamp = sanitizeData(
                        data.timestamp || new Date().toLocaleTimeString(),
                    );

                    const messageElement = document.createElement("div");
                    messageElement.className = "message";

                    const userSpan = document.createElement("span");
                    userSpan.className = "user";
                    userSpan.textContent = username + ":";
                    messageElement.appendChild(userSpan);

                    messageElement.appendChild(document.createTextNode(" "));

                    const msgSpan = document.createElement("span");
                    msgSpan.textContent = message;
                    messageElement.appendChild(msgSpan);

                    messageElement.appendChild(document.createTextNode(" "));

                    const timeSmall = document.createElement("small");
                    timeSmall.textContent = timestamp;
                    messageElement.appendChild(timeSmall);

                    chatBox.appendChild(messageElement);
                    chatBox.scrollTop = chatBox.scrollHeight;
                } catch (error) {
                    console.error("❌ Erro ao processar mensagem:", error);
                }
            });

            function login() {
                try {
                    // Rate limiting
                    if (!loginLimiter.isAllowed()) {
                        document.getElementById("login-result").textContent =
                            "❌ Muitas tentativas. Aguarde 1 minuto.";
                        document.getElementById("login-result").style.color =
                            "red";
                        return;
                    }

                    const username = validateInput(
                        document.getElementById("username").value,
                        50,
                    );
                    const password = validateInput(
                        document.getElementById("password").value,
                        50,
                    );

                    if (!username || !password) {
                        document.getElementById("login-result").textContent =
                            "❌ Usuário e senha são obrigatórios";
                        document.getElementById("login-result").style.color =
                            "red";
                        return;
                    }

                    // Validar caracteres permitidos
                    if (!/^[a-zA-Z0-9_-]+$/.test(username)) {
                        document.getElementById("login-result").textContent =
                            "❌ Usuário contém caracteres inválidos";
                        document.getElementById("login-result").style.color =
                            "red";
                        return;
                    }

                    fetch("/api/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-Requested-With": "XMLHttpRequest",
                        },
                        body: JSON.stringify({ username, password }),
                    })
                        .then((res) => {
                            if (!res.ok)
                                throw new Error(
                                    "Resposta inválida do servidor",
                                );
                            return res.json();
                        })
                        .then((data) => {
                            const resultDiv =
                                document.getElementById("login-result");
                            if (data && data.success) {
                                const displayName = sanitizeData(
                                    data.user?.username || "Usuário",
                                );
                                resultDiv.textContent = `✅ Login bem-sucedido! Bem-vindo, ${displayName}`;
                                resultDiv.style.color = "green";
                            } else {
                                resultDiv.textContent = `❌ Falha no login: ${sanitizeData(
                                    data?.message || "Erro desconhecido",
                                )}`;
                                resultDiv.style.color = "red";
                            }
                        })
                        .catch((error) => {
                            console.error("Erro na requisição:", error);
                            document.getElementById(
                                "login-result",
                            ).textContent = "❌ Erro ao conectar ao servidor";
                            document.getElementById(
                                "login-result",
                            ).style.color = "red";
                        });
                } catch (error) {
                    console.error("Erro no login:", error);
                    document.getElementById("login-result").textContent =
                        "❌ Erro ao processar login";
                }
            }

            function searchMessages() {
                try {
                    // Rate limiting
                    if (!searchLimiter.isAllowed()) {
                        document.getElementById("search-results").textContent =
                            "❌ Muitas buscas. Aguarde um momento.";
                        return;
                    }

                    const search = validateInput(
                        document.getElementById("search").value,
                        100,
                    );

                    fetch(
                        `/api/messages?search=${encodeURIComponent(search)}`,
                        {
                            method: "GET",
                            headers: { "X-Requested-With": "XMLHttpRequest" },
                        },
                    )
                        .then((res) => {
                            if (!res.ok) throw new Error("Resposta inválida");
                            return res.json();
                        })
                        .then((messages) => {
                            const resultsDiv =
                                document.getElementById("search-results");
                            resultsDiv.innerHTML = "";

                            const heading = document.createElement("h3");
                            heading.textContent = "Resultados:";
                            resultsDiv.appendChild(heading);

                            if (
                                Array.isArray(messages) &&
                                messages.length > 0
                            ) {
                                messages.forEach((msg) => {
                                    if (!msg || typeof msg !== "object") return;

                                    const messageElement =
                                        document.createElement("div");
                                    messageElement.className = "message";
                                    const username = sanitizeData(msg.username);
                                    const message = sanitizeData(msg.message);

                                    const userBold =
                                        document.createElement("strong");
                                    userBold.textContent = username + ":";
                                    messageElement.appendChild(userBold);

                                    messageElement.appendChild(
                                        document.createTextNode(" "),
                                    );

                                    const msgSpan =
                                        document.createElement("span");
                                    msgSpan.textContent = message;
                                    messageElement.appendChild(msgSpan);

                                    resultsDiv.appendChild(messageElement);
                                });
                            } else {
                                const noResults = document.createElement("p");
                                noResults.textContent =
                                    "Nenhuma mensagem encontrada";
                                resultsDiv.appendChild(noResults);
                            }
                        })
                        .catch((error) => {
                            console.error("Erro na busca:", error);
                            document.getElementById(
                                "search-results",
                            ).textContent = "❌ Erro ao buscar mensagens";
                        });
                } catch (error) {
                    console.error("Erro na busca:", error);
                    document.getElementById("search-results").textContent =
                        "❌ Erro ao processar busca";
                }
            }

            function sendMessage() {
                try {
                    // Rate limiting
                    if (!messageLimiter.isAllowed()) {
                        alert("❌ Muitas mensagens. Aguarde um momento.");
                        return;
                    }

                    const input = document.getElementById("message-input");
                    const message = validateInput(input.value, 500);

                    if (!message) {
                        alert("❌ Mensagem não pode estar vazia");
                        return;
                    }

                    // Remover espaços em branco excessivos
                    const cleanMessage = message.replace(/\s+/g, " ");

                    socket.emit("chat message", { message: cleanMessage });
                    input.value = "";
                } catch (error) {
                    console.error("Erro ao enviar mensagem:", error);
                }
            }

            function getFlag() {
                try {
                    // Rate limiting
                    if (!flagLimiter.isAllowed()) {
                        document.getElementById("flag-result").textContent =
                            "❌ Muitas tentativas. Aguarde 1 minuto.";
                        document.getElementById("flag-result").style.color =
                            "red";
                        return;
                    }

                    const secret = validateInput(
                        document.getElementById("secret").value,
                        50,
                    );

                    if (!secret) {
                        document.getElementById("flag-result").textContent =
                            "❌ Senha administrativa é obrigatória";
                        document.getElementById("flag-result").style.color =
                            "red";
                        return;
                    }

                    fetch("/api/getFlag", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-Requested-With": "XMLHttpRequest",
                        },
                        body: JSON.stringify({ secret }),
                    })
                        .then((res) => {
                            if (!res.ok) throw new Error("Resposta inválida");
                            return res.json();
                        })
                        .then((data) => {
                            const resultDiv =
                                document.getElementById("flag-result");
                            if (data && data.flag) {
                                const flag = sanitizeData(data.flag);
                                resultDiv.textContent = `🚩 Flag: ${flag}`;
                                resultDiv.style.color = "green";
                                resultDiv.style.fontWeight = "bold";
                            } else {
                                resultDiv.textContent = `❌ Erro: ${sanitizeData(
                                    data?.error || "Erro desconhecido",
                                )}`;
                                resultDiv.style.color = "red";
                            }
                        })
                        .catch((error) => {
                            console.error("Erro ao obter flag:", error);
                            document.getElementById("flag-result").textContent =
                                "❌ Erro ao conectar ao servidor";
                            document.getElementById("flag-result").style.color =
                                "red";
                        });
                } catch (error) {
                    console.error("Erro ao obter flag:", error);
                    document.getElementById("flag-result").textContent =
                        "❌ Erro ao processar requisição";
                }
            }
        </script>
    </body>
</html>
