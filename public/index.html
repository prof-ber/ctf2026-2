<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <!-- Content Security Policy to prevent XSS -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none';"
        />
        <title>🪗🎇Chat Junino!🥜🌽</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
            }
            .container {
                max-width: 800px;
                margin: 0 auto;
            }
            .chat-box {
                border: 1px solid #ccc;
                height: 300px;
                overflow-y: scroll;
                padding: 10px;
                margin-bottom: 10px;
            }
            .message {
                margin-bottom: 5px;
                padding: 5px;
                background: #f0f0f0;
            }
            .message .user {
                font-weight: bold;
                color: #333;
            }
            input[type="text"],
            input[type="password"] {
                width: 200px;
                padding: 5px;
                margin: 5px;
            }
            button {
                padding: 5px 10px;
                margin: 5px;
            }
            .section {
                margin-bottom: 20px;
                padding: 10px;
                border: 1px solid #ddd;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🪗🎇Chat Junino!🥜🌽</h1>

            <div class="section">
                <h2>Login</h2>
                <input type="text" id="username" placeholder="Usuário" />
                <input type="password" id="password" placeholder="Senha" />
                <button onclick="login()">Login</button>
                <div id="login-result"></div>
            </div>

            <div class="section">
                <h2>Buscar Mensagens</h2>
                <input
                    type="text"
                    id="search"
                    placeholder="Buscar nas mensagens..."
                />
                <button onclick="searchMessages()">Buscar</button>
                <div id="search-results"></div>
            </div>

            <div class="section">
                <h2>Chat em Tempo Real</h2>
                <div id="chat-messages" class="chat-box"></div>
                <input
                    type="text"
                    id="message-input"
                    placeholder="Digite sua mensagem..."
                />
                <button onclick="sendMessage()">Enviar</button>
            </div>

            <div class="section">
                <h2>Área Administrativa</h2>
                <input
                    type="password"
                    id="secret"
                    placeholder="Senha administrativa"
                />
                <button onclick="getFlag()">Obter Flag</button>
                <div id="flag-result"></div>
            </div>
        </div>

        <script src="/socket.io/socket.io.js"></script>
        <script>
            // Utility function to escape HTML and prevent XSS
            function escapeHtml(text) {
                const map = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;",
                };
                return text.replace(/[&<>"']/g, (char) => map[char]);
            }

            // Validate input to prevent XSS
            function validateInput(input, maxLength = 500) {
                if (!input || typeof input !== "string") {
                    return "";
                }
                return input.trim().substring(0, maxLength);
            }

            // Sanitize user data before display
            function sanitizeData(data) {
                if (typeof data === "string") {
                    return escapeHtml(validateInput(data));
                }
                return "";
            }

            const socket = io();

            socket.on("chat message", (data) => {
                try {
                    const chatBox = document.getElementById("chat-messages");
                    const username = sanitizeData(data.username || "Usuário");
                    const message = sanitizeData(data.message);
                    const timestamp = sanitizeData(
                        data.timestamp || new Date().toLocaleTimeString(),
                    );

                    const messageElement = document.createElement("div");
                    messageElement.className = "message";
                    messageElement.innerHTML = `<span class="user">${username}:</span> <span>${message}</span> <small>${timestamp}</small>`;
                    chatBox.appendChild(messageElement);
                    chatBox.scrollTop = chatBox.scrollHeight;
                } catch (error) {
                    console.error("Erro ao processar mensagem:", error);
                }
            });

            function login() {
                try {
                    const username = validateInput(
                        document.getElementById("username").value,
                    );
                    const password = validateInput(
                        document.getElementById("password").value,
                    );

                    if (!username || !password) {
                        document.getElementById("login-result").textContent =
                            "Usuário e senha são obrigatórios";
                        return;
                    }

                    fetch("/api/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password }),
                    })
                        .then((res) => res.json())
                        .then((data) => {
                            const resultDiv =
                                document.getElementById("login-result");
                            if (data.success) {
                                const username = sanitizeData(
                                    data.user?.username || "Usuário",
                                );
                                resultDiv.textContent = `Login bem-sucedido! Bem-vindo, ${username}`;
                            } else {
                                resultDiv.textContent = `Falha no login: ${sanitizeData(data.message || "Erro desconhecido")}`;
                            }
                        })
                        .catch((error) => {
                            console.error("Erro na requisição:", error);
                            document.getElementById(
                                "login-result",
                            ).textContent = "Erro ao conectar ao servidor";
                        });
                } catch (error) {
                    console.error("Erro no login:", error);
                    document.getElementById("login-result").textContent =
                        "Erro ao processar login";
                }
            }

            function searchMessages() {
                try {
                    const search = validateInput(
                        document.getElementById("search").value,
                    );

                    fetch(`/api/messages?search=${encodeURIComponent(search)}`)
                        .then((res) => res.json())
                        .then((messages) => {
                            const resultsDiv =
                                document.getElementById("search-results");
                            resultsDiv.innerHTML = "";

                            const heading = document.createElement("h3");
                            heading.textContent = "Resultados:";
                            resultsDiv.appendChild(heading);

                            if (
                                Array.isArray(messages) &&
                                messages.length > 0
                            ) {
                                messages.forEach((msg) => {
                                    const messageElement =
                                        document.createElement("div");
                                    messageElement.className = "message";
                                    const username = sanitizeData(msg.username);
                                    const message = sanitizeData(msg.message);
                                    messageElement.innerHTML = `<strong>${username}:</strong> <span>${message}</span>`;
                                    resultsDiv.appendChild(messageElement);
                                });
                            } else {
                                const noResults = document.createElement("p");
                                noResults.textContent =
                                    "Nenhuma mensagem encontrada";
                                resultsDiv.appendChild(noResults);
                            }
                        })
                        .catch((error) => {
                            console.error("Erro na busca:", error);
                            document.getElementById(
                                "search-results",
                            ).textContent = "Erro ao buscar mensagens";
                        });
                } catch (error) {
                    console.error("Erro na busca:", error);
                    document.getElementById("search-results").textContent =
                        "Erro ao processar busca";
                }
            }

            function sendMessage() {
                try {
                    const input = document.getElementById("message-input");
                    const message = validateInput(input.value);

                    if (!message) {
                        alert("Mensagem não pode estar vazia");
                        return;
                    }

                    socket.emit("chat message", { message });
                    input.value = "";
                } catch (error) {
                    console.error("Erro ao enviar mensagem:", error);
                }
            }

            function getFlag() {
                try {
                    const secret = validateInput(
                        document.getElementById("secret").value,
                    );

                    if (!secret) {
                        document.getElementById("flag-result").textContent =
                            "Senha administrativa é obrigatória";
                        return;
                    }

                    fetch("/api/getFlag", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ secret }),
                    })
                        .then((res) => res.json())
                        .then((data) => {
                            const resultDiv =
                                document.getElementById("flag-result");
                            if (data.flag) {
                                const flag = sanitizeData(data.flag);
                                resultDiv.textContent = `Flag: ${flag}`;
                            } else {
                                resultDiv.textContent = `Erro: ${sanitizeData(data.error || "Erro desconhecido")}`;
                            }
                        })
                        .catch((error) => {
                            console.error("Erro ao obter flag:", error);
                            document.getElementById("flag-result").textContent =
                                "Erro ao conectar ao servidor";
                        });
                } catch (error) {
                    console.error("Erro ao obter flag:", error);
                    document.getElementById("flag-result").textContent =
                        "Erro ao processar requisição";
                }
            }
        </script>
    </body>
</html>
